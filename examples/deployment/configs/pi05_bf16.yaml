# Static kernel selection for the pi0.5 model server.
# The pi0.5 model requests exact GELU; these rules pin the kernels the engine
# would choose for it and make an unavailable kernel an error at startup rather
# than a silent fallback. The rules select implementations, not semantics: a
# checkpoint trained with tanh-approximate GELU still runs with exact GELU.
# Action timing and robot transport are configured by the robot client.
schema: phyai.kernel/v1
profile: static
defaults:
  # Do not silently accept an unavailable requested implementation. A kernel
  # selection failure should surface during model setup/warmup, before control.
  fallback: error
overrides:
  # Gated GELU fuses activation and multiplication; use the exact GELU path.
  - id: pi05-exact-geglu
    priority: 100
    match:
      op: activation
      model.family: pi05
      attrs:
        activation: gelu
        gated: true
    use: flashinfer.activation.gelu_and_mul
  # Non-gated GELU uses the corresponding torch implementation.
  - id: pi05-exact-gelu
    priority: 100
    match:
      op: activation
      model.family: pi05
      attrs:
        activation: gelu
        gated: false
    use: torch.activation.gelu
