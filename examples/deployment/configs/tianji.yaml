# Tianji (Marvin Pro) robot client. Model settings live in pi05_tianji.yaml.
# Run with --print-config to see every field, including topics and QoS.
max_steps: null  # Actual Robot.send_action calls; null runs until Ctrl-C.

robot:
  domain_id: 24  # Must match ROS_DOMAIN_ID of the Apex stack.
  mode: 3  # 1: joint position; 3: joint impedance.
  velocity_ratio: null  # Controller percentage [1, 100]; null leaves it unchanged.
  service_timeout_s: 3.0  # End-to-end budget per controller service call.
  gripper_limits_rad: [0.0, 1.6]  # Closed/open feedback position; set to the hardware calibration.

remote:
  endpoint: tcp://127.0.0.1:5555
  timeout_s: 2.0
  warmup_timeout_s: 120.0

control:
  control_hz: 200.0  # Commands per second while a chunk executes.
  max_sample_age_s: 0.5
  observation_timeout_s: 10.0
  shutdown_timeout_s: 2.0
  max_control_lateness_s: 0.01

schedule:
  strategy: stop_and_refill
  action_hz: 25.0  # The checkpoint's 40 ms target spacing (action_stride 2 at 50 Hz).
  execution_horizon: 20  # 20 targets at 25 Hz: each chunk executes for 0.8 s.
